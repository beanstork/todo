<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>my tasks</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F7F5F0;
      --surface: #FFFFFF;
      --surface2: #F0EDE6;
      --border: rgba(0,0,0,0.08);
      --border-strong: rgba(0,0,0,0.15);
      --text: #1A1714;
      --text-muted: #6B6760;
      --text-faint: #A8A5A0;
      --accent: #2D5016;
      --accent-light: #E8F0E0;
      --urgent: #C0392B;
      --urgent-light: #FDECEA;
      --high: #B7621A;
      --high-light: #FEF0E3;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1A1714;
        --surface: #242019;
        --surface2: #2D2924;
        --border: rgba(255,255,255,0.08);
        --border-strong: rgba(255,255,255,0.15);
        --text: #F0EDE6;
        --text-muted: #9A9590;
        --text-faint: #5A5752;
        --accent: #8DB870;
        --accent-light: #1E2E15;
        --urgent: #E05A4E;
        --urgent-light: #2A1512;
        --high: #D4853A;
        --high-light: #2A1E10;
      }
    }

    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* Loading */
    .loading-screen {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 999; flex-direction: column; gap: 12px;
    }
    .loading-screen p { font-family: 'DM Serif Display', serif; font-size: 18px; color: var(--text-muted); }
    .spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* Header */
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 1.5rem; position: sticky; top: 0; z-index: 100; }
    .header-inner { max-width: 680px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
    .logo { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--text); flex: 1; }
    .logo span { color: var(--accent); }

    /* View tabs */
    .view-tabs { display: flex; gap: 2px; background: var(--surface2); padding: 3px; border-radius: 8px; }
    .tab-btn { font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 4px 12px; border: none; border-radius: 6px; cursor: pointer; background: none; color: var(--text-muted); transition: background 0.15s, color 0.15s; }
    .tab-btn.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

    /* Sync dot */
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); transition: background 0.3s; flex-shrink: 0; }
    .sync-dot.syncing { background: #F0A500; animation: pulse 1s infinite; }
    .sync-dot.synced { background: #4CAF50; }
    .sync-dot.error { background: var(--urgent); }

    /* Input wrapper */
    .input-wrapper { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.75rem 1.5rem; position: sticky; top: 57px; z-index: 99; }
    .input-card { max-width: 680px; margin: 0 auto; }
    .input-row { display: flex; gap: 8px; align-items: flex-end; }
    textarea#taskInput {
      flex: 1; font-family: 'DM Sans', sans-serif; font-size: 15px; line-height: 1.5;
      padding: 8px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      background: var(--surface2); color: var(--text); resize: none; min-height: 40px; max-height: 120px; overflow-y: auto;
    }
    textarea#taskInput:focus { outline: none; border-color: var(--accent); }
    textarea#taskInput::placeholder { color: var(--text-faint); }

    .mic-btn {
      height: 40px; width: 40px; display: flex; align-items: center; justify-content: center;
      background: var(--surface2); border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      cursor: pointer; font-size: 16px; transition: background 0.15s, border-color 0.15s; flex-shrink: 0;
    }
    .mic-btn:hover { background: var(--accent-light); border-color: var(--accent); }
    .mic-btn.listening { background: var(--urgent-light); border-color: var(--urgent); animation: pulse 1s infinite; }

    .add-btn {
      height: 40px; padding: 0 16px; background: var(--accent); color: white; border: none;
      border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
      cursor: pointer; white-space: nowrap; transition: opacity 0.15s, transform 0.1s;
      display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    }
    .add-btn:hover { opacity: 0.85; }
    .add-btn:active { transform: scale(0.97); }
    .add-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .ai-status { margin-top: 6px; font-size: 12px; color: var(--text-faint); min-height: 16px; font-style: italic; }

    /* Main */
    main { max-width: 680px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }

    /* Filter pills */
    .filter-row { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; margin-bottom: 0.75rem; scrollbar-width: none; }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-pill { font-size: 12px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: background 0.15s, color 0.15s, border-color 0.15s; font-family: 'DM Sans', sans-serif; }
    .filter-pill:hover { border-color: var(--accent); color: var(--accent); }
    .filter-pill.active { background: var(--accent); color: white; border-color: var(--accent); }

    /* Stats row */
    .stats-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
    .stat-pill { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); }
    .stat-pill.danger { background: var(--urgent-light); color: var(--urgent); border-color: transparent; }
    .stat-pill.warning { background: var(--high-light); color: var(--high); border-color: transparent; }

    /* Urgent strip */
    .urgent-strip { background: var(--urgent-light); border: 1px solid rgba(192,57,43,0.15); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 1rem; }
    .urgent-strip-header { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 12px; font-weight: 500; color: var(--urgent); letter-spacing: 0.02em; }

    /* Category section */
    .category-section { margin-bottom: 1.25rem; }
    .cat-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 0 2px; }
    .cat-emoji { font-size: 15px; }
    .cat-label { font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px; letter-spacing: 0.02em; }
    .cat-count { font-size: 12px; color: var(--text-faint); margin-left: auto; }

    /* Task item */
    .task-item {
      display: flex; align-items: flex-start; gap: 10px; padding: 11px 13px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
      margin-bottom: 6px; transition: border-color 0.15s, box-shadow 0.15s; position: relative; overflow: hidden;
    }
    .task-item:hover { border-color: var(--border-strong); box-shadow: var(--shadow); }
    .task-item.is-urgent { border-left: 3px solid var(--urgent); }
    .task-item.is-high { border-left: 3px solid var(--high); }

    /* Checkbox + ripple */
    .task-check {
      width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border-strong);
      cursor: pointer; flex-shrink: 0; margin-top: 1px; transition: all 0.15s;
      display: flex; align-items: center; justify-content: center; background: none; position: relative;
    }
    .task-check:hover { border-color: var(--accent); background: var(--accent-light); }

    .ripple-ring { position: absolute; inset: -3px; border: 2px solid var(--accent); border-radius: 50%; animation: rippleOut 0.55s ease-out forwards; pointer-events: none; }
    .ripple-ring-2 { inset: -7px; animation-delay: 0.1s; }
    @keyframes rippleOut { from { transform: scale(0.7); opacity: 0.7; } to { transform: scale(2.2); opacity: 0; } }

    /* Completion animation */
    .task-item.completing .task-text { text-decoration: line-through; color: var(--text-faint); transition: color 0.2s; }
    .task-item.completing { animation: slideOut 0.45s ease-in forwards; animation-delay: 0.35s; }
    @keyframes slideOut {
      from { transform: translateX(0); opacity: 1; max-height: 200px; margin-bottom: 6px; padding-top: 11px; padding-bottom: 11px; }
      to { transform: translateX(50px); opacity: 0; max-height: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0; }
    }

    /* Task body */
    .task-body { flex: 1; min-width: 0; cursor: pointer; }
    .task-text { font-size: 14px; line-height: 1.5; color: var(--text); word-break: break-word; }
    .task-meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
    .priority-badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; font-weight: 500; }
    .p-urgent { background: var(--urgent-light); color: var(--urgent); }
    .p-high { background: var(--high-light); color: var(--high); }
    .task-due { font-size: 11px; color: var(--text-faint); }
    .task-due.overdue { color: var(--urgent); font-weight: 500; }
    .task-due.soon { color: var(--high); }
    .task-notes { font-size: 12px; color: var(--text-muted); margin-top: 2px; font-style: italic; }

    /* Inline editor */
    .task-editor { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 7px; }
    .editor-input { font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 7px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface2); color: var(--text); width: 100%; }
    .editor-input:focus { outline: none; border-color: var(--accent); }
    .editor-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .editor-select { font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 6px 8px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface2); color: var(--text); }
    .editor-notes { font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 6px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface2); color: var(--text); resize: none; height: 52px; width: 100%; }
    .editor-notes:focus, .editor-select:focus { outline: none; border-color: var(--accent); }
    .editor-actions { display: flex; gap: 8px; }
    .editor-save { flex: 1; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; padding: 7px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); cursor: pointer; }
    .editor-cancel { font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 7px 12px; background: none; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); color: var(--text-muted); cursor: pointer; }

    /* Delete button + confirm */
    .task-delete { background: none; border: none; cursor: pointer; color: var(--text-faint); font-size: 16px; padding: 2px 4px; border-radius: 4px; line-height: 1; transition: color 0.15s, opacity 0.15s; flex-shrink: 0; opacity: 0; }
    .task-item:hover .task-delete { opacity: 1; }
    .task-delete:hover { color: var(--urgent); }
    .delete-confirm { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .delete-confirm button { font-family: 'DM Sans', sans-serif; font-size: 13px; background: none; border: none; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
    .confirm-yes { color: var(--urgent); font-weight: 600; }
    .confirm-yes:hover { text-decoration: underline; }
    .confirm-cancel { color: var(--text-muted); }

    /* Empty state */
    .empty-cat { font-size: 13px; color: var(--text-faint); padding: 4px; font-style: italic; }

    /* Archive */
    .archive-toggle { font-size: 13px; color: var(--text-faint); cursor: pointer; text-decoration: underline; margin-top: 1.5rem; display: none; background: none; border: none; font-family: 'DM Sans', sans-serif; padding: 0; }
    .archived-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--radius-sm); margin-bottom: 4px; opacity: 0.5; }
    .archived-text { font-size: 13px; color: var(--text-muted); text-decoration: line-through; flex: 1; }
    .archived-del { background: none; border: none; color: var(--text-faint); cursor: pointer; font-size: 14px; padding: 2px; opacity: 0; }
    .archived-item:hover .archived-del { opacity: 1; }

    /* Error state */
    .error-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
    .error-state button { margin-top: 1rem; font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 8px 20px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); cursor: pointer; }

    /* Calendar */
    .calendar-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .calendar-nav button { font-family: 'DM Sans', sans-serif; font-size: 16px; background: none; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 6px 14px; cursor: pointer; color: var(--text); }
    .calendar-month { font-family: 'DM Serif Display', serif; font-size: 18px; color: var(--text); }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 1rem; }
    .calendar-day-header { text-align: center; font-size: 11px; font-weight: 500; color: var(--text-faint); padding: 8px 4px; background: var(--surface2); }
    .calendar-day { text-align: center; padding: 8px 4px; background: var(--surface); font-size: 13px; color: var(--text); cursor: pointer; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: background 0.1s; }
    .calendar-day:hover { background: var(--surface2); }
    .calendar-day.other-month { color: var(--text-faint); background: var(--surface2); cursor: default; }
    .calendar-day.today .day-num { color: var(--accent); font-weight: 600; }
    .calendar-day.selected { background: var(--accent-light); }
    .day-num { font-size: 13px; line-height: 1; }
    .day-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
    .day-dot.urgent { background: var(--urgent); }
    .calendar-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; }
    .calendar-panel-title { font-family: 'DM Serif Display', serif; font-size: 16px; margin-bottom: 0.75rem; color: var(--text); }

    /* Mobile */
    @media (max-width: 480px) {
      header { padding: 0.875rem 1rem; }
      .input-wrapper { padding: 0.625rem 0.875rem; top: 52px; }
      main { padding: 1rem 0.75rem 4rem; }
      .logo { font-size: 18px; }
      .task-delete { opacity: 1; }
      .archived-del { opacity: 1; }
      .editor-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <p>Loading your tasks...</p>
</div>

<header>
  <div class="header-inner">
    <div class="logo">my <span>tasks</span></div>
    <nav class="view-tabs">
      <button class="tab-btn active" data-view="list" onclick="switchView('list')">List</button>
      <button class="tab-btn" data-view="calendar" onclick="switchView('calendar')">Calendar</button>
    </nav>
    <div class="sync-dot" id="syncDot" title="Sync status"></div>
  </div>
</header>

<div class="input-wrapper">
  <div class="input-card">
    <div class="input-row">
      <textarea id="taskInput" placeholder="Add a task... e.g. 'call the vet about Mishmish booster next Tuesday'" rows="2"></textarea>
      <button class="mic-btn" id="micBtn" onclick="toggleListening()" aria-label="Voice input">🎤</button>
      <button class="add-btn" id="addBtn" onclick="handleAdd()">✦ Add</button>
    </div>
    <div class="ai-status" id="aiStatus"></div>
  </div>
</div>

<main>
  <div id="listView">
    <div class="filter-row" id="filterRow"></div>
    <div class="stats-row" id="statsRow"></div>
    <div id="urgentStrip"></div>
    <div id="taskList"></div>
    <button class="archive-toggle" id="archiveToggle" onclick="toggleArchive()"></button>
    <div class="archive-section" id="archiveSection" style="display:none"></div>
  </div>

  <div id="calendarView" style="display:none">
    <div id="calendarGrid"></div>
    <div id="calendarDayPanel"></div>
  </div>

  <div id="errorState" style="display:none" class="error-state">
    <p>Couldn't connect to Supabase.</p>
    <button onclick="loadTasks()">Retry</button>
  </div>
</main>

</body>
